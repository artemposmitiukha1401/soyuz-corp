{% extends 'admin/master.html' %}

{% block body %}
  <h1>Upload Project Image</h1>
  <p>The file is saved in projects-images/project-id/images and added to the selected project.</p>

  <form method="post" enctype="multipart/form-data">
    <div class="form-group">
      <label for="project_id">Project</label>
      <select id="project_id" class="form-control" name="project_id" required>
        <option value="">Choose a project</option>
        {% for project in projects %}
          <option value="{{ project.id }}">#{{ project.id }} - {{ project.title }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="alt_text">Image description</label>
      <input id="alt_text" class="form-control" name="alt_text" maxlength="255" required>
    </div>
    <div class="form-group">
      <label for="image">Project image</label>
      <input id="image" class="form-control" name="image" type="file" accept=".jpg,.jpeg,.png,.webp" required>
    </div>
    <button class="btn btn-primary" type="submit">Upload project image</button>
  </form>

  {% if uploaded_url %}
    <hr>
    <h2>Project image added</h2>
    <input class="form-control" value="{{ uploaded_url }}" readonly>
    <div style="margin-top: 16px;">
      <img src="{{ uploaded_url }}" alt="Uploaded project image" style="max-width: 360px; border-radius: 8px;">
    </div>
  {% endif %}
{% endblock %}
