{% extends 'admin/master.html' %}

{% block body %}
  <h1>Upload Image</h1>
  <p>Upload a project image, then paste the generated URL into a project or gallery image field.</p>

  <form method="post" enctype="multipart/form-data">
    <div class="form-group">
      <label for="image">Image</label>
      <input id="image" class="form-control" name="image" type="file" accept=".jpg,.jpeg,.png,.webp" required>
    </div>
    <button class="btn btn-primary" type="submit">Upload</button>
  </form>

  {% if uploaded_url %}
    <hr>
    <h2>Uploaded URL</h2>
    <input class="form-control" value="{{ uploaded_url }}" readonly>
    <div style="margin-top: 16px;">
      <img src="{{ uploaded_url }}" alt="Uploaded project image" style="max-width: 360px; border-radius: 8px;">
    </div>
  {% endif %}
{% endblock %}
