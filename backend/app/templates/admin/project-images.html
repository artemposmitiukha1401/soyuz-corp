{% extends 'admin/master.html' %}

{% block body %}
  <h1>Project Images</h1>

  {% if projects %}
    <div class="list-group">
      {% for project in projects %}
        <a class="list-group-item list-group-item-action" href="{{ url_for('project-images.project_detail', project_id=project.id) }}">
          <strong>#{{ project.id }} - {{ project.title }}</strong>
          <span class="badge badge-primary pull-right">{{ image_counts.get(project.id, 0) }}</span>
        </a>
      {% endfor %}
    </div>
  {% else %}
    <p>No projects have been created yet.</p>
  {% endif %}
{% endblock %}
