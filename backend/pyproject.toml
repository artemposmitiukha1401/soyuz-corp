[project]
name = "soyuz-corp-backend"
version = "0.1.0"
description = "Flask API and admin panel for Soyuz Corp projects"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.0",
    "flask-admin>=1.6.1",
    "flask-cors>=4.0.0",
    "flask-login>=0.6.3",
    "flask-migrate>=4.0.7",
    "flask-sqlalchemy>=3.1.1",
    "pillow>=10.4.0",
    "psycopg[binary]>=3.2.1",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["templates/**/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
